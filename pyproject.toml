[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "handworld-inference"
version = "0.2.0"
description = "Inference-only HandWorld: action-conditioned video and joint video/action forecasting"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "torchaudio==2.8.0",
  "diffsynth==1.1.8", "transformers==4.51.3", "accelerate==1.10.1",
  "peft==0.17.1", "numpy==1.26.4", "librosa==0.11.0",
  "safetensors==0.8.0", "Pillow==12.3.0", "imageio==2.38.0",
  "imageio-ffmpeg==0.6.0", "sentencepiece==0.2.2", "setuptools<81"
]

[project.scripts]
handworld = "handworld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handworld = ["configs/*.json"]
